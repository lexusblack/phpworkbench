name: Build PhpWorkbench Installers

on:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: "Branch or ref of lexusblack/phpworkbench-engine to build"
        required: false
        default: "phpworkbench"
      target:
        description: "Which platform(s) to build"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - linux
          - windows
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-packages.yml"
      - "scripts/package-exe.sh"
      - "scripts/package-deb.sh"
      - "scripts/package-rpm.sh"
      - "tools/**"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  RELEASE_CHANNEL: stable
  ZED_RELEASE_CHANNEL: stable
  ZED_BUNDLE: "true"

jobs:
  build-windows:
    name: Build Windows x86_64 Binaries
    if: ${{ !contains(github.event.head_commit.message, '[skip-windows]') && (github.event_name != 'workflow_dispatch' || inputs.target != 'linux') }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout PhpWorkbench
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Checkout Custom PhpWorkbench Engine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/phpworkbench-engine
          ref: ${{ github.event.inputs.engine_ref || 'phpworkbench' }}
          path: vendor/zed
          fetch-depth: 1

      - name: Install Rust toolchain (from engine rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Cargo registry & git deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('vendor/zed/Cargo.lock', 'tools/*/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Build CLI helper tools (Windows)
        shell: pwsh
        run: |
          foreach ($tool in @("php-db", "php-deploy", "php-http")) {
            cargo build --release --manifest-path "tools/$tool/Cargo.toml"
          }

      - name: Build custom PhpWorkbench engine (Windows)
        shell: pwsh
        working-directory: vendor/zed
        run: |
          $env:ZED_RELEASE_CHANNEL = "stable"
          $env:RELEASE_CHANNEL = "stable"
          $env:ZED_BUNDLE = "true"
          $env:CARGO_INCREMENTAL = "0"
          cargo --config .cargo/bundle-config.toml build --release --package zed --bin zed

      - name: Stage Windows PE binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows/bin | Out-Null
          Copy-Item -Force vendor/zed/target/release/zed.exe dist/windows/bin/PhpWorkbench.exe
          foreach ($tool in @("php-db", "php-deploy", "php-http")) {
            Copy-Item -Force "tools/$tool/target/release/$tool.exe" "dist/windows/bin/$tool.exe"
          }
          foreach ($extra in @("conpty.dll", "OpenConsole.exe")) {
            $p = "vendor/zed/target/release/$extra"
            if (Test-Path $p) {
              Copy-Item -Force $p "dist/windows/bin/$extra"
            }
          }
          Get-ChildItem dist/windows/bin

      - name: Upload Windows binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries-x86_64
          path: dist/windows/bin/*
          if-no-files-found: error

  package-windows-exe:
    name: Package Windows Installer (.exe)
    needs: build-windows
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup
          df -h

      - name: Checkout PhpWorkbench
        uses: actions/checkout@v4

      - name: Download Windows PE binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries-x86_64
          path: dist/windows/bin

      - name: Install NSIS & Pillow
        run: |
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g; s|https://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 </dev/null
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends -o Acquire::Retries=5 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 nsis python3-pil file </dev/null

      - name: Build NSIS Windows installer
        run: |
          ls -la dist/windows/bin
          file dist/windows/bin/PhpWorkbench.exe
          ./scripts/package-exe.sh
          file dist/PhpWorkbench-Setup-1.0.0.exe
          ls -lh dist/PhpWorkbench-Setup-1.0.0.exe

      - name: Upload Windows Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: PhpWorkbench-Windows-Setup-x86_64
          path: dist/PhpWorkbench-Setup-*.exe
          if-no-files-found: error

  build-linux-x86_64:
    name: Build & Package Linux x86_64 (.deb & .rpm)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target != 'windows' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup
          df -h

      - name: Checkout PhpWorkbench
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Checkout Custom PhpWorkbench Engine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/phpworkbench-engine
          ref: ${{ github.event.inputs.engine_ref || 'phpworkbench' }}
          path: vendor/zed
          fetch-depth: 1

      - name: Install Linux build & packaging dependencies
        run: |
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g; s|https://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 </dev/null
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends -o Acquire::Retries=5 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
            build-essential pkg-config cmake clang lld llvm curl ca-certificates git jq gettext-base \
            musl-tools musl-dev libasound2-dev libfontconfig-dev libgit2-dev libglib2.0-dev \
            libssl-dev libva-dev libvulkan1 libvulkan-dev libwayland-dev libx11-xcb-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev libsqlite3-dev libssh2-1-dev libstdc++-12-dev \
            rpm dpkg-dev python3-pil file </dev/null

      - name: Install Rust toolchain (from engine rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Cargo registry & git deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('vendor/zed/Cargo.lock', 'tools/*/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Build CLI helper tools (Linux x86_64)
        run: |
          mkdir -p dist/linux/bin/x86_64
          for tool in php-db php-deploy php-http; do
            cargo build --release --manifest-path "tools/$tool/Cargo.toml"
            cp "tools/$tool/target/release/$tool" "dist/linux/bin/x86_64/$tool"
            strip "dist/linux/bin/x86_64/$tool"
          done

      - name: Build custom PhpWorkbench engine (Linux x86_64)
        run: |
          cd vendor/zed
          export ZED_RELEASE_CHANNEL=stable
          export RELEASE_CHANNEL=stable
          export ZED_BUNDLE=true
          export CARGO_INCREMENTAL=0
          cargo --config .cargo/bundle-config.toml build --release --package zed --bin zed
          mkdir -p ../../dist/linux/bin/x86_64
          cp target/release/zed ../../dist/linux/bin/x86_64/zed
          strip ../../dist/linux/bin/x86_64/zed
          file ../../dist/linux/bin/x86_64/zed
          ldd ../../dist/linux/bin/x86_64/zed || true

      - name: Build .deb and .rpm packages (x86_64)
        run: |
          ./scripts/package-deb.sh amd64
          ./scripts/package-rpm.sh x86_64
          echo "=== Verify DEB contents ==="
          dpkg-deb -c dist/phpworkbench_1.0.0_amd64.deb | grep -E "bin/|phpworkbench|themes" || true
          echo "=== Verify RPM contents ==="
          rpm -qlp dist/phpworkbench-1.0.0-1.x86_64.rpm | grep -E "bin/|phpworkbench" || true
          ls -lh dist/*.deb dist/*.rpm

      - name: Upload Linux x86_64 packages (.deb & .rpm)
        uses: actions/upload-artifact@v4
        with:
          name: PhpWorkbench-Linux-x86_64
          path: |
            dist/phpworkbench_*_amd64.deb
            dist/phpworkbench-*-*.x86_64.rpm
          if-no-files-found: error
