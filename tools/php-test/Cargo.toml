[package]
name = "php-test"
version = "0.1.0"
edition = "2021"
description = "PHPUnit/Pest test runner bridge for the IDE"

[[bin]]
name = "php-test"
path = "src/main.rs"

[lib]
name = "php_test"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
