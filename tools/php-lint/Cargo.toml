[package]
name = "php-lint"
version = "0.1.0"
edition = "2021"
description = "PHPStan bridge for IDE inspections"

[[bin]]
name = "php-lint"
path = "src/main.rs"

[lib]
name = "php_lint"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
